# Service + mock provider. `docker compose up --build`
services:
  mock:
    build: .
    command: ["voice-agent", "mock", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0.2}
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 5s
      retries: 10

  agent:
    build: .
    environment:
      STT_BASE_URL: http://mock:9000/v1
      LLM_BASE_URL: http://mock:9000/v1
      TTS_BASE_URL: http://mock:9000/v1
    ports: ["8080:8080"]
    volumes: ["agent-data:/data"]
    depends_on:
      mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      retries: 10

volumes:
  agent-data:
